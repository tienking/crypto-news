# ── Thêm vào server block HTTPS trong /etc/nginx/sites-available/tienmai ──────
# Đặt TRƯỚC location / (root).

    location = /projects/crypto-news { return 301 /projects/crypto-news/; }
    location /projects/crypto-news/ {
        alias /root/projects/crypto-news/frontend/dist/;
        try_files $uri $uri/ /projects/crypto-news/index.html;
    }
    location /api/crypto-news/ {
        proxy_pass http://127.0.0.1:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
